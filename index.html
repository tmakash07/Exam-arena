<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Exam Arena — Premium online exam platform (Local Edition)">
<title>Exam Arena</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#4f46e5;--soft:#eef2ff;--good:#12b76a;--bad:#f04438;--warn:#f79009;--shadow:0 12px 35px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
header{height:68px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:24px;position:sticky;top:0;z-index:20}.logo{font-weight:900;font-size:21px}.logo span{color:var(--primary)}nav{display:flex;gap:6px;flex:1}nav button,.icon{background:transparent;padding:9px 12px;color:var(--muted);border-radius:9px}nav button.active,nav button:hover{background:var(--soft);color:var(--primary)}.mobile{display:none}.container{max-width:1180px;margin:auto;padding:32px 20px}.hero{background:linear-gradient(135deg,#111827,#312e81);color:white;border-radius:24px;padding:42px;box-shadow:var(--shadow)}h1{font-size:42px;line-height:1.05;margin:0 0 12px}.hero p{color:#d0d5dd;max-width:650px}.btn{padding:11px 17px;border-radius:10px;font-weight:750}.primary{background:var(--primary);color:#fff}.white{background:#fff;color:#111827}.ghost{background:var(--soft);color:var(--primary)}.danger{background:#fee4e2;color:#b42318}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:0 5px 18px rgba(16,24,40,.035)}.stat b{font-size:28px;display:block;margin-top:5px}.muted{color:var(--muted);font-size:13px}.section{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.section h2{margin:0}.exam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tag{display:inline-block;background:var(--soft);color:var(--primary);padding:5px 8px;border-radius:8px;font-size:12px;font-weight:700}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;color:var(--muted);font-size:13px}.search{display:flex;gap:10px;margin:15px 0}.search input,.search select,input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:none;font:inherit}.search input{flex:1}textarea{resize:vertical;width:100%}label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-top:10px;margin-bottom:4px}.actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}.auth{max-width:440px;margin:70px auto}.auth input{width:100%;margin:7px 0}.question{font-size:20px;font-weight:750;margin:18px 0}.option{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:12px;margin:9px 0}.option.selected{border-color:var(--primary);background:var(--soft)}.letter{font-weight:900;margin-right:10px;color:var(--primary)}.exam-top{display:flex;justify-content:space-between;align-items:center;gap:15px}.timer{font-weight:900;font-size:22px}.danger-t{color:var(--bad)}.warn{color:var(--warn)}.progress{height:7px;background:var(--line);border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary)}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.qnum{padding:9px;border-radius:8px;background:var(--bg)}.qnum.answered{background:var(--soft);color:var(--primary)}.qnum.current{outline:2px solid var(--primary)}.qnum.marked{box-shadow:inset 0 -3px 0 var(--warn)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.center{text-align:center}.modal{position:fixed;inset:0;background:rgba(16,24,40,.55);display:grid;place-items:center;z-index:50;padding:20px}.modalbox{max-width:460px;width:100%;background:var(--card);border-radius:18px;padding:25px}.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 17px;border-radius:10px;z-index:100}.notice{padding:12px 15px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;margin:15px 0}
.review-item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;background:var(--card)}
.review-opt{padding:10px;border-radius:8px;margin:6px 0;font-size:14px;border:1px solid var(--line)}
.review-opt.correct{background:#d1fae5;border-color:#10b981;color:#065f46}
.review-opt.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.explanation{background:var(--soft);padding:10px;border-radius:8px;margin-top:10px;font-size:13px;color:var(--text)}
body.dark{--bg:#0b1020;--card:#121a2b;--text:#f2f4f7;--muted:#98a2b3;--line:#25304a;--soft:#202b50}body.dark header{background:rgba(18,26,43,.92)}body.dark .hero{background:linear-gradient(135deg,#080d18,#1e1b4b)}
@media(max-width:850px){nav{display:none}.mobile{display:block;margin-left:auto}.grid{grid-template-columns:repeat(2,1fr)}.exam-grid{grid-template-columns:1fr 1fr}h1{font-size:34px}}
@media(max-width:520px){.container{padding:22px 13px}.grid,.exam-grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.hero{padding:28px}.search{flex-wrap:wrap}.search input{min-width:100%}.actions .btn{padding:10px 12px}.exam-top{align-items:flex-start}.question{font-size:17px}}
</style>
</head>
<body>
<header>
<div class="logo">Exam<span>Arena</span></div>
<nav id="nav"></nav>
<button class="icon" onclick="toggleTheme()">◐</button>
<button class="icon mobile" onclick="toggleNav()">☰</button>
</header>
<main id="main"></main>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const DEFAULT_EXAMS = [
{ id: 1, title: "World Geography & History Quiz", description: "Interesting test on world capitals, milestones, and oceans.", category: "General", difficulty: "Hard", duration_minutes: 5, total_marks: 3, negative_mark: 0, published: true, created_by: "system" },
{ id: 2, title: "Basic JavaScript & Web Fundamentals", description: "Test your frontend and scripting knowledge.", category: "Programming", difficulty: "Medium", duration_minutes: 10, total_marks: 10, negative_mark: 0.5, published: true, created_by: "system" }
];
const DEFAULT_QUESTIONS = {
1: [
{ id: 101, exam_id: 1, question: "What is the capital of Australia?", options: ["Sydney", "Melbourne", "Canberra", "Perth"], correct_answer: 2, marks: 1, position: 1, explanation: "Canberra is the federal capital city of Australia." },
{ id: 102, exam_id: 1, question: "Which ocean is the largest by surface area?", options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"], correct_answer: 3, marks: 1, position: 2, explanation: "The Pacific Ocean is the largest and deepest of Earth's oceanic divisions." },
{ id: 103, exam_id: 1, question: "In which year did World War II end?", options: ["1943", "1945", "1950", "1939"], correct_answer: 1, marks: 1, position: 3, explanation: "World War II concluded in 1945 with the surrender of Axis powers." }
],
2: [
{ id: 201, exam_id: 2, question: "Which keyword is used to declare a variable in modern JavaScript?", options: ["var", "let", "variable", "string"], correct_answer: 1, marks: 5, position: 1, explanation: "'let' and 'const' were introduced in ES6 for block-scoped variable declarations." }
]
};
if (!localStorage.getItem("ea_exams")) localStorage.setItem("ea_exams", JSON.stringify(DEFAULT_EXAMS));
if (!localStorage.getItem("ea_questions")) localStorage.setItem("ea_questions", JSON.stringify(DEFAULT_QUESTIONS));
if (!localStorage.getItem("ea_attempts")) localStorage.setItem("ea_attempts", JSON.stringify([]));
if (!localStorage.getItem("ea_users")) localStorage.setItem("ea_users", JSON.stringify([]));
let user = JSON.parse(localStorage.getItem("ea_current_user") || "null");
let exams = JSON.parse(localStorage.getItem("ea_exams") || "[]");
let attempts = JSON.parse(localStorage.getItem("ea_attempts") || "[]").filter(a => user && a.user_id === user.id);
let questions = [];
let page = "home";
let adminSelectedExamId = null, adminQuestions = [];
let exam = null, answers = [], marked = new Set(), idx = 0, endAt = 0, timer = null, lastResult = null, reviewExamData = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "'" }[m]));
function toast(x) { $("toast").textContent = x; $("toast").classList.remove("hidden"); setTimeout(() => $("toast").classList.add("hidden"), 2200); }
function toggleTheme() { document.body.classList.toggle("dark"); localStorage.theme = document.body.classList.contains("dark") ? "dark" : "light"; }
if (localStorage.theme === "dark") document.body.classList.add("dark");
function toggleNav() { let n = $("nav"); n.style.display = n.style.display === "flex" ? "none" : "flex"; }
function go(p) { page = p; render(); scrollTo(0, 0); }
function modal(title, body, buttons = "") { $("modalbox").innerHTML = <h3>${title}</h3><div>${body}</div><div class="actions">${buttons}</div>; $("modal").classList.remove("hidden"); }
function closeModal() { $("modal").classList.add("hidden"); }
function checkChallengeUrl() {
const params = new URLSearchParams(window.location.search);
const challengeId = params.get('challenge');
if (challengeId) {
window.history.replaceState({}, document.title, window.location.pathname);
setTimeout(() => { startExam(challengeId); }, 600);
}
}
function copyChallenge(id) {
const link = window.location.origin + window.location.pathname + "?challenge=" + id;
const tempInput = document.createElement("input");
tempInput.value = link;
document.body.appendChild(tempInput);
tempInput.select();
document.execCommand("copy");
document.body.removeChild(tempInput);
toast("Challenge Link Copied! Share with your friend.");
}
                                           async function doSignin() {
const email = $("authEmail").value.trim();
const pass = $("authPass").value.trim();
if (!email || !pass) return toast("Please enter email and password.");
let users = JSON.parse(localStorage.getItem("ea_users") || "[]");
let found = users.find(u => u.email === email && u.password === pass);
if (!found) return toast("Invalid email or password.");
user = { id: found.id, email: found.email, user_metadata: { full_name: found.full_name } };
localStorage.setItem("ea_current_user", JSON.stringify(user));
loadUserData();
toast("Logged in successfully!");
go("home");
}
async function doSignup() {
const name = $("authName").value.trim();
const email = $("authEmail").value.trim();
const pass = $("authPass").value.trim();
if (!name || !email || !pass) return toast("All fields are required for signup.");
let users = JSON.parse(localStorage.getItem("ea_users") || "[]");
if (users.some(u => u.email === email)) return toast("Email already registered. Please login.");
const newUser = { id: "user_" + Date.now(), full_name: name, email, password: pass, role: "student" };
users.push(newUser);
localStorage.setItem("ea_users", JSON.stringify(users));
user = { id: newUser.id, email: newUser.email, user_metadata: { full_name: newUser.full_name } };
localStorage.setItem("ea_current_user", JSON.stringify(user));
loadUserData();
toast("Account created successfully!");
go("home");
}
function signOut() {
user = null;
localStorage.removeItem("ea_current_user");
attempts = [];
go("home");
toast("Logged out");
}
function loadUserData() {
if (!user) return;
exams = JSON.parse(localStorage.getItem("ea_exams") || "[]");
let allAttempts = JSON.parse(localStorage.getItem("ea_attempts") || "[]");
attempts = allAttempts.filter(a => a.user_id === user.id);
}
function loadQuestions(examId) {
let allQ = JSON.parse(localStorage.getItem("ea_questions") || "{}");
questions = allQ[examId] || [];
return questions;
}
async function saveAttempt() {
if (!user || !exam) return;
const correct = answers.filter((a, i) => a !== null && questions[i]?.correct_answer === a).length;
const wrong = answers.filter((a, i) => a !== null && questions[i]?.correct_answer !== a).length;
const unanswered = answers.filter(a => a === null).length;
const score = correct * Number(exam.marks || 1) - wrong * Number(exam.negative_mark || 0);
const r = { id: Date.now(), exam_id: exam.id, user_id: user.id, score, correct, wrong, unanswered, submitted_at: new Date().toISOString(), exam_title: exam.title };
let allAttempts = JSON.parse(localStorage.getItem("ea_attempts") || "[]");
allAttempts.unshift(r);
localStorage.setItem("ea_attempts", JSON.stringify(allAttempts));
attempts.unshift(r);
reviewExamData = {
examTitle: exam.title,
questions: JSON.parse(JSON.stringify(questions)),
userAnswers: [...answers]
};
return r;
}
function nav() {
if (!user) return "";
return ["home", "exams", "results", "leaderboard", "profile", "create"].filter(Boolean)
.map(x => <button class="${page === x ? "active" : ""}" onclick="go('${x}')">${x === "create" ? "➕ Create Exam" : x[0].toUpperCase() + x.slice(1)}</button>).join("");
}
function authView() {
return <div class="container"><div class="card auth"><h2>Welcome to Exam Arena</h2><p class="muted">Login or create an account (Local Edition).</p> <input id="authName" placeholder="Full name (for signup)"> <input id="authEmail" type="email" placeholder="Email"> <input id="authPass" type="password" placeholder="Password"> <div class="actions"><button class="btn ghost" onclick="doSignup()">Create account</button><button class="btn primary" onclick="doSignin()">Login</button></div> </div></div>;
}
function home() {
loadUserData();
let total = attempts.length, avg = total ? Math.round(attempts.reduce((a, x) => a + Number(x.score || 0), 0) / total) : 0;
return <div class="container"><section class="hero"><h1>Test your preparation.</h1><p>Offline Local Edition. Take exams, challenge friends with custom links, and review detailed solutions instantly!</p><button class="btn white" onclick="go('exams')">Explore Exams →</button></section> <div class="grid"><div class="card stat"><span class="muted">Available Exams</span><b>${exams.filter(x => x.published).length}</b></div><div class="card stat"><span class="muted">Completed</span><b>${total}</b></div><div class="card stat"><span class="muted">Average Score</span><b>${avg}</b></div><div class="card stat"><span class="muted">Mode</span><b>Local ✓</b></div></div> <div class="section"><h2>Latest Exams</h2><button class="btn ghost" onclick="go('exams')">View all</button></div><div class="exam-grid">${exams.filter(x => x.published).slice(0, 3).map(examCard).join("") || <div class="card">No published exams yet.</div>}</div></div>;
}
function examCard(e) {
return <div class="card"><span class="tag">${esc(e.category || "General")}</span><h3>${esc(e.title)}</h3><p class="muted">${esc(e.description || "Online mock test")}</p><div class="meta"><span>📝 ${e.duration_minutes || 0} min</span><span>⏱ ${esc(e.difficulty || "Medium")}</span></div> <div style="display:flex;gap:8px;margin-top:12px;"> <button class="btn primary" style="flex:1" onclick="startExam(${e.id})">Start Exam</button> <button class="btn ghost" style="padding:11px" onclick="copyChallenge(${e.id})" title="Copy Challenge Link">🔗 Share</button> </div> </div>;
}
function examsView() {
loadUserData();
return <div class="container"><div class="section"><div><h2>Exams</h2><span class="muted">Choose a published test.</span></div></div> <div class="search"><input id="search" oninput="filterExams()" placeholder="Search exams..."><select id="cat" onchange="filterExams()"><option value="">All categories</option>${[...new Set(exams.map(e => e.category).filter(Boolean))].map(c => <option>${esc(c)}</option>).join("")}</select></div> <div id="examList" class="exam-grid">${exams.filter(x => x.published).map(examCard).join("") || <div class="card">No published exams found.</div>}</div></div>;
}
function filterExams() {
let q = ($("search").value \vert{}\vert{} "").toLowerCase(), c = $("cat").value;
let list = exams.filter(e => e.published && (!q || e.title.toLowerCase().includes(q)) && (!c || e.category === c));
$("examList").innerHTML = list.map(examCard).join("") || <div class="card">No matching exams.</div>;
}
async function startExam(id) {
if (!user) return go("login");
exam = exams.find(e => Number(e.id) === Number(id)); if (!exam) return;
try {
loadQuestions(id);
if (!questions.length) return toast("This exam has no questions yet.");
modal("Ready to begin?", <b>${esc(exam.title)}</b><br><br>${questions.length} questions · ${exam.duration_minutes} minutes · Negative marking: ${exam.negative_mark || 0},
<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="beginExam()">Start Exam</button>);
} catch (e) { toast(e.message); }
}
function beginExam() {
closeModal(); answers = Array(questions.length).fill(null); marked = new Set(); idx = 0; endAt = Date.now() + Number(exam.duration_minutes || 10) * 60000; page = "exam"; render(); clearInterval(timer); timer = setInterval(tick, 1000); tick();
}
function tick() {
let left = Math.max(0, endAt - Date.now()), sec = Math.ceil(left / 1000), el = $("timer");
if (el) { el.textContent = ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}; el.className = "timer " + (sec <= 60 ? "danger-t" : sec <= 300 ? "warn" : ""); }
if (left <= 0) { clearInterval(timer); finish(true); }
}
function examUI() {
let q = questions[idx], answered = answers.filter(x => x !== null).length;
return <div class="container"><div class="exam-top"><div><b>${esc(exam.title)}</b><div class="muted">Question ${idx + 1} of ${questions.length}</div></div><div id="timer" class="timer">--:--</div><button class="btn danger" onclick="confirmFinish()">Submit</button></div> <div class="progress" style="margin:14px 0 20px"><i style="width:${answered / questions.length * 100}%"></i></div><div class="grid" style="grid-template-columns:1fr 280px"> <div class="card"><span class="tag">Question ${idx + 1}</span><div class="question">${esc(q.question)}</div>${(q.options || []).map((o, i) => <button class="option {answers[idx] === i ? "selected" : ""}" onclick="answer({i})"><span class="letter">{String.fromCharCode(65 + i)}</span>{esc(o)}</button>).join("")}<div class="actions"><button class="btn ghost" onclick="prev()">← Previous</button><button class="btn ghost" onclick="mark()">⚑ ${marked.has(idx) ? "Marked" : "Mark"}</button><button class="btn primary" onclick="next()">Next →</button></div></div> <aside class="card"><b>Navigator</b><div class="palette">${questions.map((_, i) => <button class="qnum {i === idx ? "current " : ""}{answers[i] !== null ? "answered " : ""}{marked.has(i) ? "marked" : ""}" onclick="jump({i})">${i + 1}</button>).join("")}</div><div class="muted" style="margin-top:15px">Answered: ${answered} · Remaining: ${questions.length - answered}</div></aside></div></div>;
}
function answer(i) { answers[idx] = i; render(); }
function next() { idx < questions.length - 1 ? (idx++, render()) : confirmFinish(); }
function prev() { if (idx > 0) { idx--; render(); } }
function jump(i) { idx = i; render(); }
function mark() { marked.has(idx) ? marked.delete(idx) : marked.add(idx); render(); }
function confirmFinish() { modal("Submit exam?", ${answers.filter(x => x !== null).length}/${questions.length} questions answered., <button class="btn ghost" onclick="closeModal()">Continue</button><button class="btn primary" onclick="finish(false)">Submit</button>); }
async function finish(auto = false) {
clearInterval(timer); timer = null; closeModal();
try {
const r = await saveAttempt(); lastResult = r; page = "result"; render(); toast(auto ? "Time is up — submitted" : "Exam submitted");
} catch (e) { toast("Could not save attempt: " + e.message); }
}
async function reviewExam(examId) {
try {
const e = exams.find(x => x.id === Number(examId) || x.id === examId);
const qList = loadQuestions(examId);
reviewExamData = {
examTitle: e?.title || "Exam Solutions",
questions: qList,
userAnswers: []
};
page = "review";
render();
} catch (err) {
toast("Error loading review: " + err.message);
}
}
function reviewView() {
if (!reviewExamData) return resultsView();
const { examTitle, questions: qList, userAnswers } = reviewExamData;
return <div class="container"> <div class="section"> <div> <h2>Question Solutions</h2> <span class="muted">${esc(examTitle)}</span> </div> <button class="btn ghost" onclick="go('results')">← Back to Results</button> </div> ${qList.map((q, i) => { const userAns = userAnswers[i]; const isCorrect = userAns === q.correct_answer; return <div class="review-item">
<div style="font-weight:700;margin-bottom:8px;">Q${i + 1}. {esc(q.question)}</div>{(q.options || []).map((opt, optIdx) => {
let cls = "review-opt";
if (optIdx === q.correct_answer) cls += " correct";
else if (userAns === optIdx && !isCorrect) cls += " wrong";
return <div class="${cls}"> <b>${String.fromCharCode(65 + optIdx)}.</b> ${esc(opt)} ${optIdx === q.correct_answer ? " ✓ (Correct Answer)" : ""} ${userAns === optIdx && !isCorrect ? " ✗ (Your Answer)" : ""} </div>;
}).join("")}
${q.explanation ? <div class="explanation"><b>Explanation:</b> ${esc(q.explanation)}</div> : ''}
</div>; }).join("")} </div>;
}
function resultsView() {
loadUserData();
return <div class="container"><div class="section"><h2>My Results</h2></div><div class="card">${attempts.length ? <table><tr><th>Exam</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Date</th><th>Action</th></tr>${attempts.map(r => { let e = exams.find(x => x.id === r.exam_id); return <tr><td>${esc(r.exam_title || e?.title || "Exam")}</td><td><b>${Number(r.score).toFixed(2)}</b></td><td>${r.correct}</td><td>${r.wrong}</td><td>${new Date(r.submitted_at).toLocaleDateString()}</td><td><button class="btn ghost" style="padding:4px 8px;font-size:12px" onclick="reviewExam('${r.exam_id}')">Review Answers</button></td></tr>; }).join("")}</table>:No attempts yet. Start an exam first.}</div></div>;
}
function resultView() {
let r = lastResult; if (!r) return resultsView();
return <div class="container"><div class="card center"><span class="tag">Completed</span><h2>${esc(r.exam_title || exam?.title || "Exam")}</h2><h1>${Number(r.score).toFixed(2)}</h1><div class="grid"><div><b>${r.correct}</b><div class="muted">Correct</div></div><div><b>${r.wrong}</b><div class="muted">Wrong</div></div><div><b>${r.unanswered}</b><div class="muted">Unanswered</div></div><div><b>${Math.round(r.correct / (r.correct + r.wrong + r.unanswered) * 100)}%</b><div class="muted">Accuracy</div></div></div><div class="actions"><button class="btn ghost" onclick="page='review';render();">Review Detailed Answers</button><button class="btn primary" onclick="go('exams')">Take Another</button></div></div></div>;
}
function profileView() {
loadUserData();
return <div class="container"><div class="card"><h2>${esc(user?.user_metadata?.full_name || "Student")}</h2><p class="muted">${esc(user.email)}</p><div class="grid"><div><b>${attempts.length}</b><div class="muted">Completed</div></div><div><b>${attempts.reduce((a, x) => a + Number(x.correct || 0), 0)}</b><div class="muted">Correct answers</div></div><div><b>${exams.length}</b><div class="muted">Exams available</div></div><div><b>Student</b><div class="muted">Role</div></div></div><button class="btn danger" onclick="signOut()">Log out</button></div></div>;
}
function leaderboard() {
let allAttempts = JSON.parse(localStorage.getItem("ea_attempts") || "[]");
return <div class="container"><div class="section"><h2>Leaderboard</h2></div><div class="card">${allAttempts.length ? <table><tr><th>Rank</th><th>Score</th><th>Date</th></tr>${allAttempts.sort((a,b)=>b.score - a.score).slice(0,10).map((r, i)=><tr><td><b>#${i+1}</b></td><td><b>${Number(r.score).toFixed(2)}</b></td><td>${new Date(r.submitted_at).toLocaleDateString()}</td></tr>).join("")}</table>:No records found yet.}</div></div>;
}
async function onAdminSelectExam(examId) {
if (!examId) { adminSelectedExamId = null; adminQuestions = []; render(); return; }
adminSelectedExamId = examId;
loadAdminQuestions(examId);
render();
}
function loadAdminQuestions(examId) {
adminQuestions = loadQuestions(examId);
}
function doCreateExam(e) {
if (e) e.preventDefault();
const title = $("examTitle").value.trim();
if (!title) return toast("Exam title is required.");
const description = ("examDesc").value.trim();
const category = $("examCat").value.trim() || "General";
const difficulty = $("examDifficulty").value;
const duration_minutes = parseInt($("examDuration").value, 10) || 30;
const total_marks = parseInt($("examMarks").value, 10) || 100;
const negative_mark = parseFloat(("examNegMark").value) || 0;
const published = $("examPublished").checked;
const newExam = {
id: Date.now(),
title,
description,
category,
difficulty,
duration_minutes,
total_marks,
negative_mark,
published,
created_by: user.id
};
exams.unshift(newExam);
localStorage.setItem("ea_exams", JSON.stringify(exams));
toast("Exam created successfully!");
adminSelectedExamId = newExam.id;
loadAdminQuestions(newExam.id);
render();
}
function doCreateQuestion(e) {
if (e) e.preventDefault();
const exam_id = $("qExamId").value;
if (!exam_id) return toast("Please select an exam.");
const question = $("qText").value.trim();
if (!question) return toast("Question text is required.");
const opt0 = $("qOpt0").value.trim();
const opt1 = $("qOpt1").value.trim();
const opt2 = $("qOpt2").value.trim();
const opt3 = $("qOpt3").value.trim();
const explanation = $("qExplanation").value.trim();
const options = [opt0, opt1, opt2, opt3].filter(o => o !== "");
if (options.length < 2) return toast("At least 2 options are required.");
const correct_answer = parseInt(("qCorrect").value, 10);
const marks = parseInt(("qMarks").value, 10) || 1;
const position = parseInt($("qPos").value, 10) || 1;
let allQ = JSON.parse(localStorage.getItem("ea_questions") || "{}");
if (!allQ[exam_id]) allQ[exam_id] = [];
const newQ = { id: Date.now(), exam_id, question, options, correct_answer, marks, position, explanation };
allQ[exam_id].push(newQ);
localStorage.setItem("ea_questions", JSON.stringify(allQ));
toast("Question added successfully!");
adminSelectedExamId = exam_id;
loadAdminQuestions(exam_id);
render();
}

function render() {
 $("nav").innerHTML = nav();
 if (!user && page !== "login") { page = "login"; }
 $("main").innerHTML = page === "login" ? authView() 
   : page === "home" ? home() 
   : page === "exams" ? examsView() 
   : page === "exam" ? examUI() 
   : page === "results" ? resultsView() 
   : page === "result" ? resultView() 
   : page === "review" ? reviewView() 
   : page === "profile" ? profileView() 
   : page === "leaderboard" ? leaderboard() 
   : page === "create" ? createView() 
   : home();
}

if (user) { loadUserData(); }
render();
checkChallengeUrl();
